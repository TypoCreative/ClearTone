name: Build signed Windows ZIP

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows x64 signed
    runs-on: windows-latest
    env:
      WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Require Windows signing certificate
        shell: pwsh
        run: |
          if (-not $env:WIN_CSC_LINK -or -not $env:WIN_CSC_KEY_PASSWORD) {
            throw "WIN_CSC_LINK and WIN_CSC_KEY_PASSWORD repository secrets are required."
          }

      - name: Build, sign, and package Windows app
        run: npm run build

      - name: Run RNNoise tests
        shell: pwsh
        run: ctest --test-dir build/windows/x64 -C Release --output-on-failure

      - name: Verify release archive
        shell: pwsh
        run: |
          $archive = Get-ChildItem "dist/ClearTone-*-windows-x64-signed.zip" | Select-Object -First 1
          if (-not $archive) {
            throw "Signed Windows release archive was not produced."
          }
          $hash = (Get-FileHash $archive.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "### Windows release output" >> $env:GITHUB_STEP_SUMMARY
          "- File: ``$($archive.Name)``" >> $env:GITHUB_STEP_SUMMARY
          "- SHA-256: ``$hash``" >> $env:GITHUB_STEP_SUMMARY

      - name: Upload ZIP directly to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: dist/ClearTone-*-windows-x64-signed.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
