name: Build macOS DMG

on:
  release:
    types: [published]
  # Allows building from a branch without relying on a stale release tag.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26-intel
            arch: x64
          - os: macos-26
            arch: arm64
    env:
      CLEARTONE_TARGET_ARCH: ${{ matrix.arch }}
      CLEARTONE_REQUIRE_DEVELOPER_ID: ${{ github.event_name == 'release' }}
      # Store the base64-encoded .p12 and password as repository secrets.
      # workflow_dispatch can still create an unsigned test build when omitted.
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Require signing certificate for a published release
        if: github.event_name == 'release'
        run: |
          if [ -z "$CSC_LINK" ]; then
            echo "::error::Missing CSC_LINK repository secret for signed release"
            exit 1
          fi

      - name: Select Xcode with Swift 6.2+
        run: |
          xcode="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n1)"
          if [ -z "$xcode" ]; then
            echo "::error::Xcode 26 (Swift 6.2) not found on the runner"
            exit 1
          fi
          sudo xcode-select -s "$xcode"
          echo "Using $xcode"

      - name: Print macOS toolchain versions
        run: |
          sw_vers
          xcodebuild -version
          swift --version
          head -n 1 native/swift-engine/Package.swift

      - name: Build DMG
        run: |
          trap 'rm -f _dev-id-apple.p12' EXIT

          if [ -n "$CSC_LINK" ]; then
            node -e "require('fs').writeFileSync('_dev-id-apple.p12', Buffer.from(process.env.CSC_LINK, 'base64'))"
            chmod 600 _dev-id-apple.p12
          fi

          env -u CSC_LINK npm --workspace apps run dist:mac

      - name: Verify packaged architecture
        run: |
          file apps/resources/native/ClearToneEngine
          case "${{ matrix.arch }}" in
            x64) file apps/resources/native/ClearToneEngine | grep -q "x86_64" ;;
            arm64) file apps/resources/native/ClearToneEngine | grep -q "arm64" ;;
          esac

      - name: Upload DMG to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: apps/dist/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
