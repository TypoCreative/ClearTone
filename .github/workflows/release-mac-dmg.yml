name: Build macOS DMG

on:
  release:
    types: [published]
  # Allows building from a branch without relying on a stale release tag.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26-intel
            arch: x64
          - os: macos-26
            arch: arm64
    env:
      CLEARTONE_TARGET_ARCH: ${{ matrix.arch }}
      CLEARTONE_REQUIRE_DEVELOPER_ID: ${{ github.event_name == 'release' }}
      # Store the base64-encoded signing .p12 and password as repository secrets.
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Require signing certificate for a published release
        if: github.event_name == 'release'
        run: |
          if [ -z "$CSC_LINK" ]; then
            echo "::error::Missing CSC_LINK repository secret for signed release"
            exit 1
          fi

      - name: Select Xcode with Swift 6.2+
        run: |
          xcode="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n1)"
          if [ -z "$xcode" ]; then
            echo "::error::Xcode 26 (Swift 6.2) not found on the runner"
            exit 1
          fi
          sudo xcode-select -s "$xcode"
          echo "Using $xcode"

      - name: Print macOS toolchain versions
        run: |
          sw_vers
          xcodebuild -version
          swift --version
          head -n 1 apps/macos/native/swift-engine/Package.swift

      - name: Build DMG
        run: |
          keychain="$RUNNER_TEMP/cleartone-signing.keychain-db"
          keychain_password="$(uuidgen)"
          cleanup() {
            security delete-keychain "$keychain" 2>/dev/null || true
            rm -f "$RUNNER_TEMP/cleartone-signing.p12"
          }
          trap cleanup EXIT

          if [ -n "$CSC_LINK" ]; then
            echo "$CSC_LINK" | base64 -D > "$RUNNER_TEMP/cleartone-signing.p12"
            chmod 600 "$RUNNER_TEMP/cleartone-signing.p12"
            security create-keychain -p "$keychain_password" "$keychain"
            security unlock-keychain -p "$keychain_password" "$keychain"
            security set-keychain-settings -lut 21600 "$keychain"
            security import "$RUNNER_TEMP/cleartone-signing.p12" -k "$keychain" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
            security list-keychains -d user -s "$keychain"

            identities="$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(.*\)"/\1/p')"
            identity="$(printf '%s\n' "$identities" | grep '^Developer ID Application:' | head -n 1 || true)"
            [ -z "$identity" ] && identity="$(printf '%s\n' "$identities" | head -n 1)"
            if [ -z "$identity" ]; then
              echo "::error::No code-signing identity with private key found in the .p12"
              exit 1
            fi
            if [ "${{ github.event_name }}" = "release" ] && [[ "$identity" != Developer\ ID\ Application:* ]]; then
              echo "::error::Published releases require a Developer ID Application identity"
              exit 1
            fi
            export CLEARTONE_APP_SIGN_IDENTITY="$identity"
            export CLEARTONE_DRIVER_SIGN_IDENTITY="$identity"
          fi

          scripts/package-mac.sh

      - name: Verify packaged architecture
        run: |
          file dist/ClearTone.app/Contents/MacOS/ClearTone
          case "${{ matrix.arch }}" in
            x64) file dist/ClearTone.app/Contents/MacOS/ClearTone | grep -q "x86_64" ;;
            arm64) file dist/ClearTone.app/Contents/MacOS/ClearTone | grep -q "arm64" ;;
          esac

      - name: Upload DMG to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
