name: Build macOS DMG

on:
  release:
    types: [published]
  # Allows building from a branch without relying on a stale release tag.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26-intel
            arch: x64
          - os: macos-26
            arch: arm64
    env:
      CLEARTONE_TARGET_ARCH: ${{ matrix.arch }}
      # The current _dev-id-apple.p12 contains an Apple Development identity.
      CLEARTONE_REQUIRE_DEVELOPER_ID: 0
      # Store the base64-encoded signing .p12 and password as repository secrets.
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Require macOS signing certificate
        run: |
          if [ -z "$CSC_LINK" ] || [ -z "$CSC_KEY_PASSWORD" ]; then
            echo "::error::CSC_LINK and CSC_KEY_PASSWORD repository secrets are required"
            exit 1
          fi

      - name: Prepare _dev-id-apple.p12
        run: |
          node -e 'const fs=require("fs"); const value=process.env.CSC_LINK.replace(/\s/g, ""); const data=Buffer.from(value, "base64"); if(data.length < 128) throw new Error("CSC_LINK is not a valid base64 P12"); fs.writeFileSync("_dev-id-apple.p12", data, {mode: 0o600});'

      - name: Select Xcode with Swift 6.2+
        run: |
          xcode="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n1)"
          if [ -z "$xcode" ]; then
            echo "::error::Xcode 26 (Swift 6.2) not found on the runner"
            exit 1
          fi
          sudo xcode-select -s "$xcode"
          echo "Using $xcode"

      - name: Print macOS toolchain versions
        run: |
          sw_vers
          xcodebuild -version
          swift --version
          head -n 1 apps/macos/native/swift-engine/Package.swift

      - name: Build DMG
        run: npm run build

      - name: Remove temporary signing certificate
        if: always()
        run: rm -f _dev-id-apple.p12

      - name: Verify packaged architecture
        run: |
          file dist/ClearTone.app/Contents/MacOS/ClearTone
          case "${{ matrix.arch }}" in
            x64) file dist/ClearTone.app/Contents/MacOS/ClearTone | grep -q "x86_64" ;;
            arm64) file dist/ClearTone.app/Contents/MacOS/ClearTone | grep -q "arm64" ;;
          esac

      - name: Upload DMG to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
