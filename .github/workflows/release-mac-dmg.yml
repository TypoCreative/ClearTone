name: Build macOS DMG

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-macos:
    name: macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-13
            arch: x64
          - os: macos-14
            arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build native engine (release)
        run: |
          cd native/swift-engine
          swift build -c release --disable-sandbox
          mkdir -p ../../apps/electron/resources/native
          cp .build/release/ClearToneEngine ../../apps/electron/resources/native/ClearToneEngine

      - name: Build DMG
        run: npm --workspace apps/electron run dist:mac -- --${{ matrix.arch }}

      - name: Upload DMG to Release
        uses: softprops/action-gh-release@v2
        with:
          files: apps/electron/dist/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
