name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify-macos:
    name: macOS
    # Package.swift requires Swift 6.2, which is provided by Xcode 26.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - name: Select Xcode with Swift 6.2+
        run: |
          xcode="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n1)"
          if [ -z "$xcode" ]; then
            echo "::error::Xcode 26 (Swift 6.2) not found on the runner"
            exit 1
          fi
          sudo xcode-select -s "$xcode"
          swift --version
      - run: npm ci
      - run: npm audit --audit-level=low
      - run: npm run check
