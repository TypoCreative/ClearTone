name: Build macOS PKG

on:
  release:
    types: [published]
  # Allows building from a branch without relying on a stale release tag.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26-intel
            arch: x64
          - os: macos-26
            arch: arm64
    env:
      CLEARTONE_TARGET_ARCH: ${{ matrix.arch }}
      # Public assets must pass Developer ID signing, notarization and Gatekeeper.
      CLEARTONE_REQUIRE_DEVELOPER_ID: 1
      # Store the base64-encoded signing .p12 and password as repository secrets.
      CSC_LINK: ${{ secrets.MAC_CSC_LINK || secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD || secrets.CSC_KEY_PASSWORD }}
      MAC_INSTALLER_CSC_LINK: ${{ secrets.MAC_INSTALLER_CSC_LINK }}
      CLEARTONE_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.MAC_INSTALLER_CSC_KEY_PASSWORD }}
      MAC_NOTARY_KEY_BASE64: ${{ secrets.MAC_NOTARY_KEY_BASE64 }}
      CLEARTONE_NOTARY_KEY_PATH: ${{ runner.temp }}/cleartone-notary.p8
      CLEARTONE_NOTARY_KEY_ID: ${{ secrets.MAC_NOTARY_KEY_ID }}
      CLEARTONE_NOTARY_ISSUER_ID: ${{ secrets.MAC_NOTARY_ISSUER_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22

      - name: Require macOS signing certificate
        run: |
          if [ -z "$CSC_LINK" ] || [ -z "$CSC_KEY_PASSWORD" ]; then
            echo "::error::CSC_LINK and CSC_KEY_PASSWORD repository secrets are required"
            exit 1
          fi
          if [ -z "$MAC_NOTARY_KEY_BASE64" ] || [ -z "$CLEARTONE_NOTARY_KEY_ID" ]; then
            echo "::error::MAC_NOTARY_KEY_BASE64 and MAC_NOTARY_KEY_ID are required (plus MAC_NOTARY_ISSUER_ID for a team API key)"
            exit 1
          fi

      - name: Prepare _dev-id-apple.p12
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          function decode(value, path) {
            const data = Buffer.from(value.replace(/\s/g, ""), "base64");
            if (data.length < 128) throw new Error("Invalid signing/notary secret: " + path);
            fs.writeFileSync(path, data, {mode: 0o600});
          }
          decode(process.env.CSC_LINK, "_dev-id-apple.p12");
          if (process.env.MAC_INSTALLER_CSC_LINK) decode(process.env.MAC_INSTALLER_CSC_LINK, "_dev-id-installer.p12");
          decode(process.env.MAC_NOTARY_KEY_BASE64, process.env.CLEARTONE_NOTARY_KEY_PATH);
          NODE

      - name: Select Xcode with Swift 6.2+
        run: |
          xcode="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n1)"
          if [ -z "$xcode" ]; then
            echo "::error::Xcode 26 (Swift 6.2) not found on the runner"
            exit 1
          fi
          sudo xcode-select -s "$xcode"
          echo "Using $xcode"

      - name: Print macOS toolchain versions
        run: |
          sw_vers
          xcodebuild -version
          swift --version
          head -n 1 apps/macos/native/swift-engine/Package.swift

      - name: Build PKG
        run: npm run build

      - name: Remove temporary signing certificate
        if: always()
        run: rm -f _dev-id-apple.p12 _dev-id-installer.p12 "$CLEARTONE_NOTARY_KEY_PATH"

      - name: Verify packaged architecture
        run: |
          file dist/ClearTone.app/Contents/MacOS/ClearTone
          case "${{ matrix.arch }}" in
            x64) file dist/ClearTone.app/Contents/MacOS/ClearTone | grep -q "x86_64" ;;
            arm64) file dist/ClearTone.app/Contents/MacOS/ClearTone | grep -q "arm64" ;;
          esac

      - name: Verify installer payload
        run: |
          package="$(find dist -maxdepth 1 -name 'ClearTone-*-mac-${{ matrix.arch }}.pkg' -print -quit)"
          if [ -z "$package" ]; then
            echo "::error::Expected macOS PKG was not created"
            exit 1
          fi
          pkgutil --payload-files "$package" | grep -q '^\./Applications/ClearTone.app/Contents/MacOS/ClearTone$'
          pkgutil --check-signature "$package"
          xcrun stapler validate "$package"
          spctl --assess --type install --verbose=2 "$package"
          shasum -a 256 "$package" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload PKG to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@40c2ca6ddd77ba2a30bbea8f67409c0f76868d67 # v3
        with:
          fail_on_unmatched_files: true
          files: dist/*.pkg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
